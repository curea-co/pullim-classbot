name: prod-verify

# Production 회귀 자동화 (2026-05-14).
# main push / 일일 schedule / 수동 dispatch 세 경로에서 풀림 클래스봇 production URL에
# Playwright hit하여 색·chat·slider 회귀를 검증한다.
#
# 모노레포 전환 (2026-05-27): src/** → apps/classbot/** 로 paths/working-directory 갱신.
#
# 두 레인 (2026-09-16, 완성 계획 §10 해소 1 — 워크플로 편집은 그 지시로 승인):
#  코어 화면이 곧 비로그인 방문자를 풀림 OS 로그인으로 보낸다(결정 ②). 익명으로 도는 이 워크플로가
#  그 뒤에도 서도록 Playwright 실행을 둘로 갈랐다 (apps/classbot/playwright.config.ts 의 프로젝트 셋).
#  - 익명 레인 (`--project=anon`, 항상): 공개 화면(/classbot/onboarding)이 열리는지, 코어 화면이
#    「셸 / OS 로그인 / 로그인 안내」 셋 중 하나로 서는지만 본다 — tests/e2e/public-and-gates.spec.ts.
#  - 로그인 레인 (`--project=login-student` / `login-teacher`, 시크릿 있을 때만): OS 계정은 가입 때 역할이
#    고정되므로 학생·교사 계정이 따로 필요하다. auth.setup.ts 가 역할별로 로그인 라운드트립을 돌려 세션을
#    남기고, 나머지 스펙을 첫 화면의 역할에 따라 두 프로젝트로 나눠 그 세션으로 친다.
#    시크릿 = E2E_OS_URL(없으면 https://os.pullim.ai) · E2E_OS_STUDENT_EMAIL/PASSWORD · E2E_OS_TEACHER_EMAIL/PASSWORD.
#    역할의 이메일·비밀번호 **쌍**이 다 있어야 그 레인이 돈다. 없으면 그 스텝은 **건너뛴다**(실패 아님) —
#    둘 다 없는 지금은 회귀 검증이 익명 레인만이다.
#    한 파일에서 두 역할 화면을 다 밟는 스펙 다섯은 `mixed-role-pending` 프로젝트에 있고 **여기서 부르지 않는다**
#    (역할 고정 세션에서는 RoleGuard 에 막혀 반드시 빨개진다 — playwright.config.ts 의 TODO(PR 6 e2e 트랙)).
#  - 업로드 아티팩트는 공개 리포에서 누구나 내려받는다. 로그인 레인은 트레이스를 끄고(세션 쿠키), setup 은
#    스크린샷도 끄며(로그인 폼), Playwright 가 실패 시 남기는 error-context.md(모든 input 의 값 = 비밀번호 포함,
#    실측 2026-09-16)는 업로드 path 에서 제외한다.
#
# 설계 결정: Vercel API 의존 없음. VERCEL_TOKEN secret 불요.
#  - GitHub ↔ Vercel 자동 deploy webhook이 이미 webhook으로 main push를 잡아주므로,
#    이 워크플로우는 "deploy 완료 후 production URL이 200을 응답할 때까지 polling 후
#    Playwright spec을 prod hit으로 1회 돌린다" 만 책임.
#  - Vercel 배포 상태 자체를 검증할 필요가 생기면 후속 plan에서 commit SHA 임베드 +
#    assert 패턴으로 분리.

on:
  push:
    branches: [main]
    # 빌드 산출물에 영향을 주는 경로만 트리거. docs/scripts/proc/input-only PR은 Vercel이
    # 빌드를 skip하므로 SHA polling이 영원히 실패한다 (PR #59 회고 → 2026-05-18).
    paths:
      - 'apps/classbot/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - 'tsconfig.base.json'
      - '.github/workflows/prod-verify.yml'
  schedule:
    # KST 08:00 = UTC 23:00. 일일 회귀 1회.
    - cron: '0 23 * * *'
  workflow_dispatch:

jobs:
  prod-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PROD_URL: https://classbot.pullim.ai
      PLAYWRIGHT_BASE_URL: https://classbot.pullim.ai
      PROD_CAPTURE: '1'
      # 루트 packageManager (`bun@1.3.12`) 및 ci.yml 과 일치시킴 — `latest` 사용 시
      # Bun 업데이트만으로 lockfile 해석 / workspace 동작이 비결정적으로 깨질 수 있음
      BUN_VERSION: "1.3.12"
      # 로그인 레인 게이트 — 역할별 이메일·비밀번호 쌍이 **둘 다** 있어야 켜진다.
      # step `if` 에서는 `secrets` 컨텍스트를 직접 못 쓰므로 job env 로 내려서 판정한다.
      HAS_E2E_STUDENT: ${{ secrets.E2E_OS_STUDENT_EMAIL != '' && secrets.E2E_OS_STUDENT_PASSWORD != '' }}
      HAS_E2E_TEACHER: ${{ secrets.E2E_OS_TEACHER_EMAIL != '' && secrets.E2E_OS_TEACHER_PASSWORD != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: apps/classbot
        run: bun x playwright install chromium --with-deps

      - name: Wait for production SHA match
        if: github.event_name == 'push'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          # production HTML의 <meta name="x-build-sha" content="<sha>"> 가 expected와 일치할 때까지 polling.
          # Vercel 자동 빌드 ~30~120s + CDN 전파 → 최대 10분(120 × 5s) 대기.
          # 이전 patten(`/` 200 응답만 확인)은 CDN이 stale 빌드 서빙 케이스를 못 잡았음.
          for i in $(seq 1 120); do
            html=$(curl -sS -L "$PROD_URL/classbot/chat" || true)
            current=$(echo "$html" | grep -oE 'name="x-build-sha" content="[^"]+"' | head -1 | sed 's/.*content="\(.*\)"/\1/')
            if [ "$current" = "$EXPECTED_SHA" ]; then
              echo "Production SHA matched (${EXPECTED_SHA:0:12}) after ${i} attempts."
              exit 0
            fi
            echo "Attempt ${i}/120 — expected=${EXPECTED_SHA:0:12} current=${current:0:12} (full=${current:-<no-meta>}), sleeping 5s."
            sleep 5
          done
          echo "::error title=prod-verify SHA mismatch::Production SHA did not match within 10 minutes"
          echo "  Expected SHA (this push):     ${EXPECTED_SHA}"
          echo "  Last observed production SHA: ${current:-<no-meta>}"
          if [ -n "$current" ] && [ "$current" != "<no-meta>" ]; then
            echo "  Production appears stuck at SHA ${current:0:12}."
            echo "  → Check Vercel project Deployments for build failures or paused project state since that commit."
          else
            echo "  Production HTML had no x-build-sha meta — check production URL availability and x-build-sha embed in apps/classbot/app/layout.tsx."
          fi
          exit 1

      - name: Run Playwright — anon lane (public screen + login gates)
        # 로그인 없이 돈다. 공개 화면이 열리는지, 코어 화면이 셸·OS 로그인·로그인 안내 중 하나로 서는지.
        working-directory: apps/classbot
        run: bun x playwright test --project=anon

      - name: Run Playwright — login lane, student (OS student test account)
        # 학생 계정 쌍이 있을 때만. `login-student` 는 의존인 `setup-student`(OS 로그인 라운드트립)를 함께 돈다.
        if: env.HAS_E2E_STUDENT == 'true'
        working-directory: apps/classbot
        env:
          E2E_OS_URL: ${{ secrets.E2E_OS_URL || 'https://os.pullim.ai' }}
          E2E_OS_STUDENT_EMAIL: ${{ secrets.E2E_OS_STUDENT_EMAIL }}
          E2E_OS_STUDENT_PASSWORD: ${{ secrets.E2E_OS_STUDENT_PASSWORD }}
        run: bun x playwright test --project=login-student

      - name: Run Playwright — login lane, teacher (OS teacher test account)
        # 교사 계정 쌍이 있을 때만. `login-teacher` 는 의존인 `setup-teacher` 를 함께 돈다.
        if: env.HAS_E2E_TEACHER == 'true'
        working-directory: apps/classbot
        env:
          E2E_OS_URL: ${{ secrets.E2E_OS_URL || 'https://os.pullim.ai' }}
          E2E_OS_TEACHER_EMAIL: ${{ secrets.E2E_OS_TEACHER_EMAIL }}
          E2E_OS_TEACHER_PASSWORD: ${{ secrets.E2E_OS_TEACHER_PASSWORD }}
        run: bun x playwright test --project=login-teacher

      # 레인 공용. 로그인 레인은 트레이스 대신 실패 스크린샷만 남긴다 — 공개 리포의 아티팩트에 테스트 계정
      # 세션 쿠키(트레이스 네트워크 기록의 요청 헤더)가 실리지 않게 (playwright.config.ts).
      # error-context.md 는 제외한다 — Playwright 가 실패 시 남기는 ARIA 스냅샷이고 모든 input 의 값(로그인 폼의
      # 비밀번호 포함)이 그대로 들어간다(실측 2026-09-16).
      - name: Upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace-${{ github.run_id }}
          path: |
            apps/classbot/test-results/
            !apps/classbot/test-results/**/error-context.md
          retention-days: 7

      - name: Upload production capture
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prod-capture-${{ github.run_id }}
          path: |
            apps/classbot/output/live-shots/color-palette-prod/
            !apps/classbot/output/live-shots/color-palette-prod/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore
